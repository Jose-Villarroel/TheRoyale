<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan your visit, step 2 of 3</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{font-variant-numeric:lining-nums}
a{color:#252525}a:hover{color:#8a6a2f}
button:focus-visible,a:focus-visible{outline:2px solid #252525;outline-offset:3px}
</style>
</head>
<body>
<div style="min-height: 780px; background: #fafaf9; font-family: Lato, Helvetica, Arial, sans-serif; font-weight: 400; color: #545454; display: flex; flex-direction: column">

  <header style="width: 100%; max-width: 1180px; box-sizing: border-box; margin: 0 auto; padding: 28px 24px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
    <a href="2-intereses.html" style="justify-self: start; font-size: 14px; color: #545454; text-decoration: none">← Back</a>
    <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; letter-spacing: 0.2em; color: #252525">THE ROYALE</span>
    <a href="#" style="justify-self: end; font-size: 14px; color: #545454; text-decoration: none">Close</a>
  </header>

  <main style="flex: 1; width: 100%; max-width: 720px; box-sizing: border-box; margin: 0 auto; padding: 56px 24px 64px; display: flex; flex-direction: column; gap: 36px">

    <div style="display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-size: 13px; color: #545454">Step 2 of 3</p>
      <div role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="3" aria-valuenow="2" style="height: 2px; background: #e2ded5"><div style="width: 66.6%; height: 2px; background: #c6a15b"></div></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 48px; line-height: 1.05; color: #252525">How full should your days be?</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #545454">You can change this for a single day later.</p>
    </div>

    <div role="radiogroup" aria-label="Pace" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px">
      <button type="button" role="radio" aria-checked="false" style="min-height: 150px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; text-align: left; background: #ffffff; border: 1.5px solid #e2ded5; font-family: inherit; cursor: pointer">
        <span aria-hidden="true" style="display: flex; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #c6a15b"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #c6a15b"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #e2ded5"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #e2ded5"></span></span>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; font-weight: 500; line-height: 1.1; color: #252525">Calm</span><span style="font-size: 14px; line-height: 1.5; color: #545454">Two plans a day, long breaks in between</span></span>
      </button>
      <button type="button" role="radio" aria-checked="true" style="min-height: 150px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; text-align: left; background: #ffffff; border: 1.5px solid #252525; box-shadow: 0 14px 32px -20px rgba(37,37,37,.25); font-family: inherit; cursor: pointer">
        <span aria-hidden="true" style="display: flex; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #c6a15b"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #c6a15b"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #c6a15b"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #e2ded5"></span></span>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; font-weight: 500; line-height: 1.1; color: #252525">Balanced</span><span style="font-size: 14px; line-height: 1.5; color: #545454">Three plans a day, an afternoon to rest</span></span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 150px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; text-align: left; background: #ffffff; border: 1.5px solid #e2ded5; font-family: inherit; cursor: pointer">
        <span aria-hidden="true" style="display: flex; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #c6a15b"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #c6a15b"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #c6a15b"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #c6a15b"></span></span>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; font-weight: 500; line-height: 1.1; color: #252525">Full</span><span style="font-size: 14px; line-height: 1.5; color: #545454">Four plans a day, from morning to night</span></span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding-top: 8px">
      <h2 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.15; color: #252525">And your budget outside the hotel?</h2>
      <div role="radiogroup" aria-label="Budget" style="display: flex; background: #ffffff; border: 1px solid #e2ded5">
        <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 52px; background: none; border: 0; font-family: inherit; font-size: 15px; color: #545454; cursor: pointer">Moderate</button>
        <button type="button" role="radio" aria-checked="true" style="flex: 1; height: 52px; background: #252525; border: 0; font-family: inherit; font-size: 15px; color: #ffffff; cursor: pointer">High</button>
        <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 52px; background: none; border: 0; border-left: 1px solid #e2ded5; font-family: inherit; font-size: 15px; color: #545454; cursor: pointer">No limit</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 16px; padding-top: 8px">
      <a href="4-detalles.html" style="height: 54px; box-sizing: border-box; display: flex; align-items: center; padding: 0 44px; background: #252525; font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #ffffff; text-decoration: none">Continue</a>
    </div>
  </main>
</div>
</body>
</html>
