<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan your visit, step 3 of 3</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{font-variant-numeric:lining-nums}
a{color:#252525}a:hover{color:#8a6a2f}
textarea::placeholder{color:#545454;opacity:1}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #252525;outline-offset:3px}
</style>
</head>
<body>
<div style="min-height: 900px; background: #fafaf9; font-family: Lato, Helvetica, Arial, sans-serif; font-weight: 400; color: #545454; display: flex; flex-direction: column">

  <header style="width: 100%; max-width: 1180px; box-sizing: border-box; margin: 0 auto; padding: 28px 24px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
    <a href="3-ritmo-y-presupuesto.html" style="justify-self: start; font-size: 14px; color: #545454; text-decoration: none">← Back</a>
    <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; letter-spacing: 0.2em; color: #252525">THE ROYALE</span>
    <a href="#" style="justify-self: end; font-size: 14px; color: #545454; text-decoration: none">Close</a>
  </header>

  <main style="flex: 1; width: 100%; max-width: 720px; box-sizing: border-box; margin: 0 auto; padding: 56px 24px 64px; display: flex; flex-direction: column; gap: 36px">

    <div style="display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-size: 13px; color: #545454">Step 3 of 3</p>
      <div role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3" style="height: 2px; background: #e2ded5"><div style="width: 100%; height: 2px; background: #c6a15b"></div></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 48px; line-height: 1.05; color: #252525">A few last details</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #545454">All optional. They help us choose the right tables and distances.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #252525">Dietary needs</h2>
      <div role="group" aria-label="Dietary needs" style="display: flex; flex-wrap: wrap; gap: 10px">
        <button type="button" aria-pressed="false" style="height: 44px; padding: 0 20px; background: #ffffff; border: 1px solid #e2ded5; border-radius: 22px; font-family: inherit; font-size: 14px; color: #252525; cursor: pointer">Vegan</button>
        <button type="button" aria-pressed="true" style="height: 44px; padding: 0 20px; display: flex; align-items: center; gap: 8px; background: #252525; border: 1px solid #252525; border-radius: 22px; font-family: inherit; font-size: 14px; color: #ffffff; cursor: pointer"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#c6a15b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Vegetarian</button>
        <button type="button" aria-pressed="false" style="height: 44px; padding: 0 20px; background: #ffffff; border: 1px solid #e2ded5; border-radius: 22px; font-family: inherit; font-size: 14px; color: #252525; cursor: pointer">Gluten free</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; background: #ffffff; box-shadow: 0 1px 2px rgba(37,37,37,.04), 0 14px 32px -20px rgba(37,37,37,.18)">
      <button type="button" role="switch" aria-checked="false" style="min-height: 76px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left; background: none; border: 0; border-bottom: 1px solid #eeece7; font-family: inherit; cursor: pointer">
        <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; color: #252525">Limited mobility</span><span style="font-size: 13px; color: #545454">We keep places close and suggest our car service</span></span>
        <span aria-hidden="true" style="flex: none; width: 46px; height: 28px; box-sizing: border-box; padding: 3px; display: flex; background: #e2ded5; border-radius: 14px"><span style="width: 22px; height: 22px; background: #ffffff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.15)"></span></span>
      </button>
      <button type="button" role="switch" aria-checked="false" style="min-height: 76px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left; background: none; border: 0; font-family: inherit; cursor: pointer">
        <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; color: #252525">Travelling with children</span><span style="font-size: 13px; color: #545454">We skip late evenings and add family plans</span></span>
        <span aria-hidden="true" style="flex: none; width: 46px; height: 28px; box-sizing: border-box; padding: 3px; display: flex; background: #e2ded5; border-radius: 14px"><span style="width: 22px; height: 22px; background: #ffffff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.15)"></span></span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <label for="pref-notas" style="font-size: 15px; font-weight: 700; color: #252525">Anything we should know?</label>
      <textarea id="pref-notas" rows="3" placeholder="It is our anniversary. We land late on the first day." style="box-sizing: border-box; width: 100%; padding: 16px 18px; background: #ffffff; border: 1px solid #e2ded5; font-family: inherit; font-size: 15px; line-height: 1.55; color: #252525; resize: vertical"></textarea>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 8px">
      <p style="margin: 0; max-width: 360px; font-size: 13px; line-height: 1.6; color: #545454">Only your dates and these answers are used. Your name and contact details stay with the hotel.</p>
      <a id="btn-generar-plan" href="5-concierge-compone.html" style="height: 54px; box-sizing: border-box; display: flex; align-items: center; padding: 0 40px; background: #c6a15b; font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #252525; text-decoration: none">Build my plan</a>
    </div>
  </main>
</div>
</body>
</html>
