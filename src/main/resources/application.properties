spring.application.name=backend

# ===== Base de datos H2 en memoria =====
spring.datasource.url=jdbc:h2:mem:theroyale;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Consola H2 (accesible en /h2-console) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===== Inicializar datos al arrancar =====
# Los datos se cargan via DataLoader.java (CommandLineRunner), no via data.sql
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ===== Chatbot "Royale Concierge" (Google Gemini) =====
# La clave se lee de GEMINI_API_KEY: de una variable de entorno o del archivo .env de la raíz del
# proyecto (ver .env.example). Nunca escribirla aquí: .env está en .gitignore y este archivo no.
# Sin clave el chat responde 503 y el widget muestra el aviso "offline".
# optional: si no hay .env la app arranca igual; [.properties] le dice a Spring cómo leerlo.
spring.config.import=optional:file:.env[.properties]
gemini.api-key=${GEMINI_API_KEY:}
# Google retira o satura modelos con el tiempo: gemini-2.5-flash dejó de estar disponible para cuentas
# nuevas y gemini-3.8-flash llegó a no responder. Por eso hay un modelo principal y respaldos en orden:
# si el principal falla antes de escribir (404, 429, 503 o timeout), se usa el siguiente.
# flash-lite: el más rápido (~3 s por respuesta) y el más barato que se probó con buenas respuestas.
gemini.modelo=gemini-3.1-flash-lite
gemini.modelos-respaldo=gemini-3.6-flash
gemini.max-turnos=10
gemini.timeout-segundos=20
# Respuestas JSON sin streaming (plan de visita): Gemini responde todo al final
gemini.timeout-json-segundos=60

# El perfil de pruebas (@ActiveProfiles("test")) está en src/test/resources/application-test.properties

# ===== Ubicación del hotel (ficticia) =====
hotel.direccion=640 Fifth Avenue, New York, NY 10019
hotel.latitud=40.7590
hotel.longitud=-73.9772

# ===== Plan de visita con IA =====
# Las claves llegan por variables de entorno o por el .env (ver .env.example); nunca se escriben aquí.
# Sin TICKETMASTER_API_KEY esa fuente queda apagada y aparece en fuentesNoDisponibles.
plan.ticketmaster.api-key=${TICKETMASTER_API_KEY:}
plan.nyc-open-data.app-token=${NYC_OPEN_DATA_APP_TOKEN:}
plan.nws.user-agent=TheRoyaleCourseProject/1.0 (course project)
plan.timeout-fuente-segundos=5
plan.max-generaciones-dia=5
# false: usa fuentes falsas con datos fijos (sin internet)
plan.fuentes.habilitadas=true
# Tarea diaria que vuelve a pedir el pronóstico de NWS (06:00 de Nueva York). "-" la apaga.
plan.clima.cron=0 0 6 * * *
