spring.application.name=backend

# ===== Base de datos H2 en memoria =====
spring.datasource.url=jdbc:h2:mem:theroyale;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Consola H2 (accesible en /h2-console) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===== Inicializar datos al arrancar =====
# Los datos se cargan via DataLoader.java (CommandLineRunner), no via data.sql
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ===== Chatbot "Royale Concierge" (Google Gemini) =====
# La clave se lee de GEMINI_API_KEY: de una variable de entorno o del archivo .env de la raíz del
# proyecto (ver .env.example). Nunca escribirla aquí: .env está en .gitignore y este archivo no.
# Sin clave el chat responde 503 y el widget muestra el aviso "offline".
# optional: si no hay .env la app arranca igual; [.properties] le dice a Spring cómo leerlo.
spring.config.import=optional:file:.env[.properties]
gemini.api-key=${GEMINI_API_KEY:}
# Google retira o satura modelos con el tiempo: gemini-2.5-flash dejó de estar disponible para cuentas
# nuevas y gemini-3.8-flash llegó a no responder. Por eso hay un modelo principal y respaldos en orden:
# si el principal falla antes de escribir (404, 429, 503 o timeout), se usa el siguiente.
# flash-lite: el más rápido (~3 s por respuesta) y el más barato que se probó con buenas respuestas.
gemini.modelo=gemini-3.1-flash-lite
gemini.modelos-respaldo=gemini-3.6-flash
gemini.max-turnos=10
gemini.timeout-segundos=20

# El perfil de pruebas (@ActiveProfiles("test")) está en src/test/resources/application-test.properties
