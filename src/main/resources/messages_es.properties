# ===== Mensajes de error de la API en español =====
# Registro: español neutro latinoamericano, formal de hotel de lujo. Se trata al huésped de "usted"
# (ver docs/i18n-glosario.md). No se traducen: "The Royale", "check-in", "check-out", "Concierge",
# "Newsletter", los nombres de tipo de habitación y de servicio, ni los topónimos.
#
# Este archivo está en UTF-8 de verdad (con tildes y ñ, sin escapes \uXXXX): Spring lo lee así
# gracias a spring.messages.encoding=UTF-8. No convertir a ISO-8859-1 ni a escapes Unicode.
#
# Las claves que llevan parámetros pasan por MessageFormat: ahí el apóstrofo se escribe doble ('').

# ===== Errores genéricos del manejador (no llevan código en la respuesta) =====
error.integridad-datos=No se pudo completar la operación: hay un valor duplicado o el registro está siendo usado por otros datos.
error.parametros-invalidos=Faltan datos o alguno de los valores enviados no es válido.
error.cuerpo-invalido=El cuerpo de la petición falta o tiene un formato inválido (las fechas van en yyyy-MM-dd).

