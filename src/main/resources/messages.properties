# ===== Mensajes de error de la API (idioma base: ingles) =====
# El contrato de los codigos esta en docs/i18n-codigos-error.md: ese archivo manda.
# Cada clave de aqui es un "codigo" que ApiExceptionHandler devuelve junto al mensaje.
# Los parametros van posicionales, estilo MessageFormat: {0}, {1}.
#
# ATENCION con MessageFormat: la comilla simple es el caracter de escape, asi que un apostrofo
# literal se escribe doble (''). Un {0} dentro de 'comillas simples' NO se sustituye.
#
# Este archivo se lee como UTF-8 por spring.messages.encoding=UTF-8 (ver application.properties).

# ===== Errores genericos del manejador (no llevan codigo en la respuesta) =====
error.integridad-datos=The operation could not be completed: there is a duplicate value or the record is in use by other data.
error.parametros-invalidos=Some data is missing or one of the values sent is not valid.
error.cuerpo-invalido=The request body is missing or has an invalid format (dates must be yyyy-MM-dd).

