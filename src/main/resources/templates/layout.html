<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo} + ' | The Royale'">The Royale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/servicios.css}">
</head>
<body>

<!-- ===== Header de páginas interiores ===== -->
<header th:fragment="cabecera" class="cabecera-interior">
  <div class="cabecera-interior-contenido">
    <a th:href="@{/}" class="marca-interior">
      <img th:src="@{/images/logo-removebg-preview.png}" alt="The Royale" class="marca-interior-logo">
    </a>
    <nav class="nav-interior">
      <a th:href="@{/}">Home</a>
      <a th:href="@{/services/cards}">Services</a>
      <a th:href="@{/services/table}">Table View</a>
    </nav>
    <a th:href="@{/login}" class="btn-dorado-interior">Book Now</a>
  </div>
</header>

<!-- ===== Footer de páginas interiores ===== -->
<footer th:fragment="pie" class="pie-interior">
  <div class="pie-interior-contenido">
    <span class="marca-nombre-pie">The Royale</span>
    <span class="pie-divider">·</span>
    <span class="pie-texto">Luxury Boutique Hotel · New York City</span>
    <span class="pie-divider">·</span>
    <span class="pie-texto">© 2026 The Royale. All rights reserved.</span>
  </div>
</footer>

</body>
</html>
