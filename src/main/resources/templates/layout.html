<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo} + ' | The Royale'">The Royale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/servicios.css}">
</head>
<body>

<header th:fragment="cabecera" class="cabecera-simple">
  <a th:href="@{/}" class="marca-nombre">The Royale</a>
  <nav>
    <a th:href="@{/servicios/tabla}">Services (table)</a>
    <a th:href="@{/servicios/tarjetas}">Services (cards)</a>
  </nav>
</header>

<footer th:fragment="pie" class="pie-simple">
  <span>© 2026 The Royale. All rights reserved.</span>
</footer>

</body>
</html>
