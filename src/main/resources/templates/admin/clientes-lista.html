<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Clients')}"></head>
<body>

<div th:replace="~{layout :: cabecera}"></div>

<header class="hero-interior">
  <div class="contenedor">
    <p class="eyebrow eyebrow-claro-int">Admin</p>
    <h1>Clients</h1>
    <span class="linea-dorada-horizontal-int"></span>
    <p class="hero-interior-subtexto">Manage guest accounts registered at The Royale.</p>
  </div>
</header>

<div th:replace="~{layout :: admin-nav('clientes')}"></div>

<main class="contenedor seccion-admin-contenido">
  <p th:if="${error}" th:text="${error}" class="perfil-alerta perfil-alerta-error"></p>

  <div class="admin-encabezado">
    <p class="eyebrow">03 - Clients</p>
    <a th:href="@{/admin/clientes/nuevo}" class="btn-dorado">+ New Client</a>
  </div>

  <div class="tarjetas-admin-grid">
    <article class="tarjeta-admin-item" th:each="cliente : ${clientes}">
      <div class="tarjeta-admin-info-wrap">
        <div class="tarjeta-admin-encabezado">
          <h3 th:text="${cliente.nombreCompleto}">Guest Name</h3>
          <span class="tarjeta-admin-precio" th:text="${cliente.fechaRegistro != null ? cliente.fechaRegistro : 'No date'}">No date</span>
        </div>
        <p class="tarjeta-admin-descripcion" th:text="${cliente.email}">guest@example.com</p>
        <p class="tarjeta-admin-descripcion" th:text="${cliente.telefono != null and !cliente.telefono.isEmpty() ? cliente.telefono : 'No phone'}">No phone</p>
        <div class="tarjeta-admin-acciones">
          <a th:href="@{/admin/clientes/{id}/editar(id=${cliente.id})}" class="enlace-subrayado">Edit</a>
          <form th:action="@{/admin/clientes/{id}/eliminar(id=${cliente.id})}" method="post" class="form-eliminar">
            <button type="submit" class="btn-eliminar" onclick="return confirm('Delete this client?');">Delete</button>
          </form>
        </div>
      </div>
    </article>
  </div>
</main>

<footer th:replace="~{layout :: pie}"></footer>
<div th:replace="~{layout :: script}"></div>

</body>
</html>
