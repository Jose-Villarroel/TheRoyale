<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Client Form')}"></head>
<body>

<div th:replace="~{layout :: cabecera}"></div>

<header class="hero-interior">
  <div class="contenedor">
    <p class="eyebrow eyebrow-claro-int">Admin</p>
    <h1 th:text="${cliente.id} != null ? 'Edit Client' : 'New Client'">Client Form</h1>
    <span class="linea-dorada-horizontal-int"></span>
    <p class="hero-interior-subtexto">Create or update a guest account.</p>
  </div>
</header>

<div th:replace="~{layout :: admin-nav('clientes')}"></div>

<main class="contenedor seccion-admin-contenido">
  <p th:if="${error}" th:text="${error}" class="perfil-alerta perfil-alerta-error"></p>

  <div class="formulario-admin-panel">
    <form th:action="@{/admin/clientes/guardar}" th:object="${cliente}" method="post" class="formulario-admin">
      <input type="hidden" th:field="*{id}">
      <input type="hidden" th:field="*{fechaRegistro}">

      <div class="formulario-admin-fila">
        <label>
          <span>Name</span>
          <input type="text" th:field="*{nombre}" required>
        </label>

        <label>
          <span>Last Name</span>
          <input type="text" th:field="*{apellido}" required>
        </label>
      </div>

      <div class="formulario-admin-fila">
        <label>
          <span>Email</span>
          <input type="email" th:field="*{email}" required>
        </label>

        <label>
          <span>Phone</span>
          <input type="text" th:field="*{telefono}">
        </label>
      </div>

      <label>
        <span>Password</span>
        <input type="password" id="password" name="password" th:required="${cliente.id == null}">
      </label>

      <div class="formulario-admin-botones">
        <button type="submit" class="btn-dorado">Save</button>
        <a th:href="@{/admin/clientes}" class="btn-contorno-oscuro">Cancel</a>
      </div>
    </form>
  </div>
</main>

<footer th:replace="~{layout :: pie}"></footer>
<div th:replace="~{layout :: script}"></div>

</body>
</html>
