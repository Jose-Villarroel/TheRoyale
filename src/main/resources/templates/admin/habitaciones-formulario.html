<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Form | The Royale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/landing.css}">
  <link rel="stylesheet" th:href="@{/css/servicios.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{layout :: cabecera}"></div>

<header class="hero-interior">
  <div class="contenedor">
    <p class="eyebrow eyebrow-claro-int">Admin</p>
    <h1 th:text="${habitacion.id} != null ? 'Edit Room' : 'New Room'">Room Form</h1>
    <span class="linea-dorada-horizontal-int"></span>
    <p class="hero-interior-subtexto">Assign a room type and this room inherits its imagery automatically.</p>
  </div>
</header>

<main class="contenedor seccion-admin-contenido tema-royale" style="max-width: 640px;">

  <form th:action="@{/admin/habitaciones/guardar}" th:object="${habitacion}" method="post">

    <!-- Campo oculto: si tiene id, el guardado actualiza en vez de crear -->
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label class="form-label">Number</label>
      <input type="text" th:field="*{numero}" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Room Type</label>
      <select id="tipoHabitacionSelect" name="tipoHabitacionId" class="form-select" required>
        <option value="">Select a room type</option>
        <option th:each="tipo : ${tiposHabitacion}"
                th:value="${tipo.id}"
                th:text="${tipo.nombre}"
                th:attr="data-imagen=${tipo.imagenUrl != null and !tipo.imagenUrl.isEmpty() ? tipo.imagenUrl : '/images/hotel.webp'}"
                th:selected="${habitacion.tipoHabitacion != null and habitacion.tipoHabitacion.id == tipo.id}">
          Normal
        </option>
      </select>
    </div>

    <div class="imagen-previa-wrap">
      <img id="imagenPrevia"
           th:src="@{${habitacion.tipoHabitacion != null and habitacion.tipoHabitacion.imagenUrl != null and !habitacion.tipoHabitacion.imagenUrl.isEmpty() ? habitacion.tipoHabitacion.imagenUrl : '/images/hotel.webp'}}"
           alt="Selected room type preview">
    </div>

    <div class="mb-3 mt-3">
      <label class="form-label">Price</label>
      <input type="number" step="0.01" min="0" th:field="*{precio}" class="form-control" required>
    </div>

    <div class="mb-4">
      <label class="form-label">Status</label>
      <select th:field="*{estado}" class="form-select" required>
        <option value="Disponible">Disponible</option>
        <option value="Ocupada">Ocupada</option>
        <option value="Mantenimiento">Mantenimiento</option>
      </select>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save</button>
      <a th:href="@{/admin/habitaciones}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</main>

<script>
  document.getElementById('tipoHabitacionSelect').addEventListener('change', function (e) {
    var opcion = e.target.options[e.target.selectedIndex];
    var imagen = opcion.getAttribute('data-imagen') || '/images/hotel.webp';
    document.getElementById('imagenPrevia').src = imagen;
  });
</script>

<footer th:replace="~{layout :: pie}"></footer>
<div th:replace="~{layout :: script}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
