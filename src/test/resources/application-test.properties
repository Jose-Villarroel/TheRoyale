# ===== Perfil de pruebas: base H2 separada y sin DataLoader =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
# Las pruebas nunca llaman a Gemini: se ignora GEMINI_API_KEY aunque este definida en la maquina
gemini.api-key=
# Las pruebas nunca salen a internet: fuentes del plan falsas y sin tarea programada de clima
plan.fuentes.habilitadas=false
plan.clima.cron=-
plan.ticketmaster.api-key=
plan.nyc-open-data.app-token=
