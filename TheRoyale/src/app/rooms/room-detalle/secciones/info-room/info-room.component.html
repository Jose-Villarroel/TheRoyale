<p class="eyebrow eyebrow-dorado-det">Room Detail</p>
<h1 class="detalle-titulo">{{ tipo().nombre }}</h1>
<span class="linea-dorada-det"></span>
<p class="detalle-descripcion">{{ tipo().descripcion }}</p>

<div class="detalle-precio-bloque">
  <span class="detalle-precio-label">Starting from</span>
  @if (precioDesde() !== null) {
    <span class="detalle-precio-valor">${{ precioDesde() | number:'1.0-0' }}</span>
  } @else {
    <span class="detalle-precio-valor detalle-precio-consulta">Upon request</span>
  }
  <span class="detalle-precio-nota">per night &middot; availability may vary</span>
</div>

<div class="room-resumen">
  <div>
    <span>Available now</span>
    <strong>{{ disponibles() }}</strong>
  </div>
  <div>
    <span>Total rooms</span>
    <strong>{{ total() }}</strong>
  </div>
</div>

<div class="detalle-acciones">
  <a href="/login" class="btn-dorado-interior">Book This Room</a>
  <!-- Aún no existe /rooms en Angular: se vuelve al carrusel de la landing -->
  <a routerLink="/" fragment="rooms" class="detalle-volver">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M10 5.5H1M1 5.5L5 1.5M1 5.5L5 9.5" stroke="currentColor" stroke-width="0.9" stroke-linecap="square"/></svg>
    Back to Rooms
  </a>
</div>
