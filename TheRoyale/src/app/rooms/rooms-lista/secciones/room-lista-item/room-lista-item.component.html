<a [routerLink]="['/rooms', tipo().id]" class="room-lista-imagen">
  <img [src]="tipo().imagenUrl || '/images/hotel.webp'" [alt]="tipo().nombre">
  <span class="room-lista-numero">{{ posicion() | number:'2.0-0' }}</span>
</a>

<div class="room-lista-info">
  <p class="eyebrow">Room Type</p>
  <h2>{{ tipo().nombre }}</h2>
  <span class="linea-dorada-det"></span>
  <p class="room-lista-descripcion">{{ tipo().descripcion }}</p>

  <div class="room-lista-meta">
    <div>
      <span>Starting from</span>
      @if (precioDesde() !== null) {
        <strong>${{ precioDesde() | number:'1.0-0' }}</strong>
      } @else {
        <strong>Upon request</strong>
      }
    </div>
    <div>
      <span>Available rooms</span>
      <strong>{{ disponibles() }}</strong>
    </div>
  </div>

  <a [routerLink]="['/rooms', tipo().id]" class="tabla-btn-detalle">
    View Room
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 5.5H10M10 5.5L6 1.5M10 5.5L6 9.5" stroke="currentColor" stroke-width="0.9" stroke-linecap="square"/></svg>
  </a>
</div>
