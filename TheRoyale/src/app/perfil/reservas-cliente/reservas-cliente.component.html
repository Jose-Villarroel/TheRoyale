<app-cabecera (abrirMenu)="menuAbierto = true"></app-cabecera>
<app-menu-movil [abierto]="menuAbierto" (cerrar)="menuAbierto = false"></app-menu-movil>

<!-- Mismo hero que app-hero-interior, pero con botones debajo (ese componente no admite contenido extra) -->
<header class="hero-interior">
  <div class="contenedor">
    <p class="eyebrow eyebrow-claro-int">Guest Area</p>
    <h1>Reservations</h1>
    <span class="linea-dorada-horizontal-int"></span>
    <p class="hero-interior-subtexto">
      Welcome, {{ authService.usuario?.nombre }} {{ authService.usuario?.apellido }}.
      Your account is ready for reservations, services and experiences.
    </p>
    <div class="acciones-hero-guest">
      <a routerLink="/profile" class="btn-dorado">My Profile</a>
      <button type="button" class="btn-dorado" (click)="cerrarSesion()">Sign Out</button>
    </div>
  </div>
</header>

<app-pie-pagina></app-pie-pagina>
