<app-cabecera (abrirMenu)="menuAbierto = true"></app-cabecera>
<app-menu-movil [abierto]="menuAbierto" (cerrar)="menuAbierto = false"></app-menu-movil>

<app-hero-interior
  eyebrow="Guest Profile"
  titulo="My Profile"
  [subtitulo]="cliente ? 'Manage the client profile for ' + cliente.nombre + ' ' + cliente.apellido + '.' : 'Manage your client profile.'">
</app-hero-interior>

@if (cliente) {
  <section class="perfil-seccion contenedor">
    <div class="perfil-grid">
      <!-- ===== Ficha del cliente ===== -->
      <aside app-resumen-perfil [cliente]="cliente" (cerrarSesion)="cerrarSesion()"></aside>

      <!-- ===== Edición y borrado de la cuenta ===== -->
      <section class="perfil-panel">
        @if (mensaje) {
          <p class="perfil-alerta perfil-alerta-ok">{{ mensaje }}</p>
        }
        <app-alerta-error [mensaje]="error"></app-alerta-error>

        <app-form-perfil [formulario]="perfilForm" (guardar)="guardar()" (cancelar)="cancelar()"></app-form-perfil>

        <div app-zona-peligro (eliminar)="eliminar()"></div>
      </section>
    </div>
  </section>
}

<app-pie-pagina></app-pie-pagina>
