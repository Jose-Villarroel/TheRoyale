<!-- ===== Barra utilitaria + navegación ===== -->
<div class="envoltorio-cabecera" [class.cabecera-solida]="solida || siempreSolida">

  <div class="barra-utilitaria">
    <div class="barra-utilitaria-izquierda">
      <a routerLink="/admin/tipos-habitacion" class="btn-admin-acceso">Admin</a>
    </div>
    <div class="barra-utilitaria-derecha">
      <a href="/contact">+1 507 3165 232</a>
      @if (authService.estaAutenticado) {
        @if (authService.esCliente) {
          <a routerLink="/profile">{{ authService.usuario?.nombre }} · My Profile</a>
        }
        <button type="button" class="btn-enlace-sesion" (click)="cerrarSesion()">Sign Out</button>
      } @else {
        <a routerLink="/login">Sign In</a>
        <a routerLink="/register">Sign Up</a>
      }
    </div>
  </div>

  <header class="cabecera">
    <a href="/" class="marca">
      <img src="/images/logo-removebg-preview.png" alt="The Royale" class="marca-logo">
    </a>

    <nav class="nav-principal">
      <a href="#rooms">Rooms</a>
      <a href="#services">Services</a>
      <a href="#experiences">Experiences</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>

    <a routerLink="/book" class="btn-dorado btn-nav-reserva">Book Now</a>

    <button class="menu-toggle" aria-label="Abrir menú" (click)="abrirMenu.emit()">
      <span></span><span></span>
    </button>
  </header>
</div>
