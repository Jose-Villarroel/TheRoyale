<!-- ===== Menú móvil ===== -->
<div class="menu-movil" [class.abierto]="abierto">
  <div class="menu-movil-encabezado">
    <img src="/images/logo.jpeg" alt="The Royale" class="marca-logo marca-logo-movil">
    <button id="menuCerrar" aria-label="Cerrar menú" (click)="cerrar.emit()">&times;</button>
  </div>
  <nav class="menu-movil-nav">
    <a routerLink="/admin/tipos-habitacion" class="enlace-menu-movil" (click)="cerrar.emit()">Admin</a>
    <a routerLink="/" fragment="rooms" class="enlace-menu-movil" (click)="cerrar.emit()">Rooms</a>
    <a routerLink="/" fragment="services" class="enlace-menu-movil" (click)="cerrar.emit()">Services</a>
    <a routerLink="/" fragment="experiences" class="enlace-menu-movil" (click)="cerrar.emit()">Experiences</a>
    <a routerLink="/" fragment="about" class="enlace-menu-movil" (click)="cerrar.emit()">About</a>
    <a routerLink="/" fragment="contact" class="enlace-menu-movil" (click)="cerrar.emit()">Contact</a>
  </nav>
  <div class="menu-movil-pie">
    @if (authService.estaAutenticado) {
      @if (authService.esCliente) {
        <a routerLink="/profile" (click)="cerrar.emit()">My Profile</a>
      }
      @if (authService.esOperador) {
        <a routerLink="/operator/reservas" (click)="cerrar.emit()">Operations</a>
      }
      <button type="button" class="btn-enlace-sesion" (click)="cerrarSesion()">Sign Out</button>
    } @else {
      <a routerLink="/login" (click)="cerrar.emit()">Sign In</a>
      <a routerLink="/register" (click)="cerrar.emit()">Sign Up</a>
    }
    <a routerLink="/book" class="btn-dorado" (click)="cerrar.emit()">Book Now</a>
  </div>
</div>
