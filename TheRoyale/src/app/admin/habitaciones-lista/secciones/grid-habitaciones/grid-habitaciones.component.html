<div class="tarjetas-admin-grid">
  @for (habitacion of habitaciones(); track habitacion.id) {
    <app-tarjeta-habitacion [habitacion]="habitacion" [imagenUrl]="imagenesPorTipo()[habitacion.tipoHabitacionId]" (eliminar)="eliminar.emit($event)"></app-tarjeta-habitacion>
  } @empty {
    <p class="parrafo-cuerpo">No rooms yet.</p>
  }
</div>
