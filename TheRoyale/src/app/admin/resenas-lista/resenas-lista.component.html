<app-cabecera (abrirMenu)="menuAbierto = true"></app-cabecera>
<app-menu-movil [abierto]="menuAbierto" (cerrar)="menuAbierto = false"></app-menu-movil>

<app-hero-interior
  titulo="Reviews"
  subtitulo="What guests say about their stays — hide anything inappropriate, or bring it back.">
</app-hero-interior>

<main class="contenedor seccion-admin-contenido">
  <app-nav-admin></app-nav-admin>
  <app-alerta-error [mensaje]="error"></app-alerta-error>
  @if (mensaje) {
    <p class="login-exito">{{ mensaje }}</p>
  }

  <div class="admin-encabezado">
    <p class="eyebrow">06 — {{ resenasFiltradas.length }} {{ resenasFiltradas.length === 1 ? 'review' : 'reviews' }}</p>
    <a routerLink="/" class="enlace-subrayado">← Back to site</a>
  </div>

  <app-filtros-resenas
    [tipos]="tipos"
    [tipoActivo]="tipoActivo"
    [calificacionActiva]="calificacionActiva"
    (cambiarTipo)="filtrarTipo($event)"
    (cambiarCalificacion)="filtrarCalificacion($event)">
  </app-filtros-resenas>

  <app-filtros-estado
    [opciones]="filtrosVisibilidad"
    [estadoActivo]="visibilidadActiva"
    (filtrar)="filtrarVisibilidad($event)">
  </app-filtros-estado>

  <app-grid-resenas
    [resenas]="resenasFiltradas"
    [procesandoId]="procesandoId"
    (ocultar)="ocultar($event)"
    (mostrar)="mostrar($event)">
  </app-grid-resenas>
</main>

<app-pie-pagina></app-pie-pagina>
