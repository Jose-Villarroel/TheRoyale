<header class="hero-interior">
  <div class="contenedor">
    <p class="eyebrow eyebrow-claro-int">Admin</p>
    <h1>Services</h1>
    <span class="linea-dorada-horizontal-int"></span>
    <p class="hero-interior-subtexto">Everything guests can add to their stay — manage pricing, descriptions and imagery.</p>
  </div>
</header>

<main class="contenedor seccion-admin-contenido">
  <p *ngIf="error" class="perfil-alerta perfil-alerta-error">{{ error }}</p>

  <div class="admin-encabezado">
    <p class="eyebrow">03 — Services</p>
    <a routerLink="/" class="enlace-subrayado">← Back to site</a>
    <a routerLink="/admin/servicios/nuevo" class="btn-dorado">+ New Service</a>
  </div>

  <div class="tarjetas-admin-grid">
    <article class="tarjeta-admin-item" *ngFor="let servicio of servicios">
      <div class="tarjeta-admin-imagen-wrap">
        <img [src]="servicio.imagenUrl || '/images/hotel.webp'" [alt]="servicio.nombre">
      </div>
      <div class="tarjeta-admin-info-wrap">
        <div class="tarjeta-admin-encabezado">
          <h3>{{ servicio.nombre }}</h3>
          <span class="numero-dorado">${{ servicio.precio }}</span>
        </div>
        <p class="tarjeta-admin-descripcion">{{ servicio.descripcion }}</p>
        <div class="tarjeta-admin-acciones">
          <a [routerLink]="['/admin/servicios', servicio.id, 'editar']" class="enlace-subrayado">Edit</a>
          <button type="button" class="btn-eliminar" (click)="eliminar(servicio)">Delete</button>
        </div>
      </div>
    </article>
  </div>
</main>
