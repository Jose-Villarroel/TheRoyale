<article class="tarjeta-admin-item">
  <div class="tarjeta-admin-info-wrap">
    <div class="tarjeta-admin-encabezado">
      <h3>{{ cliente().nombre }} {{ cliente().apellido }}</h3>
      <span class="tarjeta-admin-precio">{{ cliente().fechaRegistro || 'No date' }}</span>
    </div>
    <p class="tarjeta-admin-descripcion">{{ cliente().email }}</p>
    <p class="tarjeta-admin-descripcion">{{ cliente().telefono || 'No phone' }}</p>
    <div class="tarjeta-admin-acciones">
      <a [routerLink]="['/admin/clientes', cliente().id, 'editar']" class="enlace-subrayado">Edit</a>
      <button type="button" class="btn-eliminar" (click)="eliminar.emit(cliente())">Delete</button>
    </div>
  </div>
</article>
