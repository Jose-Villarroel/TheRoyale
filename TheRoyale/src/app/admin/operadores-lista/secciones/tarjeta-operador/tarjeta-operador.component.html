<article class="tarjeta-admin-item">
  <div class="tarjeta-admin-info-wrap">
    <div class="tarjeta-admin-encabezado">
      <h3>{{ operador().nombre }}</h3>
      <span class="tarjeta-admin-precio">{{ operador().tipo }}</span>
    </div>
    <p class="tarjeta-admin-descripcion">{{ operador().email }}</p>
    <div class="tarjeta-admin-acciones">
      <a [routerLink]="['/admin/operadores', operador().id, 'editar']" class="enlace-subrayado">Edit</a>
      <button type="button" class="btn-eliminar" (click)="eliminar.emit(operador())">Delete</button>
    </div>
  </div>
</article>
