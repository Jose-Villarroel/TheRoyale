<header class="hero-interior">
  <div class="contenedor">
    <p class="eyebrow eyebrow-claro-int">Admin</p>
    <h1>Room Types</h1>
    <span class="linea-dorada-horizontal-int"></span>
    <p class="hero-interior-subtexto">The tiers that define every stay at The Royale — manage their names, descriptions and imagery.</p>
  </div>
</header>

<main class="contenedor seccion-admin-contenido">
  <p *ngIf="error" class="perfil-alerta perfil-alerta-error">{{ error }}</p>

  <div class="admin-encabezado">
    <p class="eyebrow">01 — Room Types</p>
    <a routerLink="/" class="enlace-subrayado">← Back to site</a>
    <a routerLink="/admin/tipos-habitacion/nuevo" class="btn-dorado">+ New Room Type</a>
  </div>

  <div class="tarjetas-admin-grid">
    <article class="tarjeta-admin-item" *ngFor="let tipo of tipos">
      <div class="tarjeta-admin-imagen-wrap">
        <img [src]="tipo.imagenUrl || '/images/hotel.webp'" [alt]="tipo.nombre">
      </div>
      <div class="tarjeta-admin-info-wrap">
        <div class="tarjeta-admin-encabezado">
          <h3>{{ tipo.nombre }}</h3>
        </div>
        <p class="tarjeta-admin-descripcion">{{ tipo.descripcion }}</p>
        <div class="tarjeta-admin-acciones">
          <a [routerLink]="['/admin/tipos-habitacion', tipo.id, 'editar']" class="enlace-subrayado">Edit</a>
          <button type="button" class="btn-eliminar" (click)="eliminar(tipo)">Delete</button>
        </div>
      </div>
    </article>
  </div>
</main>
