<article class="tarjeta-admin-item">
  <div class="tarjeta-admin-imagen-wrap">
    <img [src]="tipo().imagenUrl || '/images/hotel.webp'" [alt]="tipo().nombre">
  </div>
  <div class="tarjeta-admin-info-wrap">
    <div class="tarjeta-admin-encabezado">
      <h3>{{ tipo().nombre }}</h3>
    </div>
    <p class="tarjeta-admin-descripcion">{{ tipo().descripcion }}</p>
    <div class="tarjeta-admin-acciones">
      <a [routerLink]="['/admin/tipos-habitacion', tipo().id, 'editar']" class="enlace-subrayado">Edit</a>
      <button type="button" class="btn-eliminar" (click)="eliminar.emit(tipo())">Delete</button>
    </div>
  </div>
</article>
