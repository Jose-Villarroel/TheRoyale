<app-cabecera (abrirMenu)="menuAbierto = true"></app-cabecera>
<app-menu-movil [abierto]="menuAbierto" (cerrar)="menuAbierto = false"></app-menu-movil>

<app-hero-interior
  [titulo]="id !== null ? 'Edit Room Type' : 'New Room Type'"
  subtitulo="Give this tier a name, a description guests will read, and a photo that represents it.">
</app-hero-interior>

<main class="contenedor seccion-admin-contenido">
  <app-alerta-error [mensaje]="error"></app-alerta-error>

  <div class="formulario-admin-panel">
    <form [formGroup]="tipoForm" (ngSubmit)="guardar()" class="formulario-admin">

      <label>
        <span>Name</span>
        <input type="text" formControlName="nombre">
        <app-campo-error
          [control]="tipoForm.get('nombre')"
          [mensajes]="{ required: 'Name is required.', minlength: 'Minimum 3 characters.', maxlength: 'Maximum 100 characters.' }">
        </app-campo-error>
      </label>

      <label>
        <span>Description</span>
        <textarea formControlName="descripcion" rows="4"></textarea>
        <app-campo-error
          [control]="tipoForm.get('descripcion')"
          [mensajes]="{ required: 'Description is required.', maxlength: 'Maximum 500 characters.' }">
        </app-campo-error>
      </label>

      <div class="formulario-admin-imagen">
        <label>
          <span>Image URL</span>
          <input type="text" formControlName="imagenUrl" placeholder="/images/suite-1.webp">
          <app-campo-error
            [control]="tipoForm.get('imagenUrl')"
            [mensajes]="{ maxlength: 'Maximum 255 characters.' }"
            [soloSiTocado]="false">
          </app-campo-error>
        </label>

        <app-imagen-previa [url]="tipoForm.get('imagenUrl')?.value"></app-imagen-previa>
      </div>

      <div class="formulario-admin-botones">
        <button type="submit" class="btn-dorado" [disabled]="tipoForm.invalid">Save</button>
        <a routerLink="/admin/tipos-habitacion" class="btn-contorno-oscuro">Cancel</a>
      </div>
    </form>
  </div>
</main>

<app-pie-pagina></app-pie-pagina>
