<header class="hero-interior">
  <div class="contenedor">
    <p class="eyebrow eyebrow-claro-int">Admin</p>
    <h1>{{ id !== null ? 'Edit Room Type' : 'New Room Type' }}</h1>
    <span class="linea-dorada-horizontal-int"></span>
    <p class="hero-interior-subtexto">Give this tier a name, a description guests will read, and a photo that represents it.</p>
  </div>
</header>

<main class="contenedor seccion-admin-contenido">
  @if (error) {
    <p class="perfil-alerta perfil-alerta-error">{{ error }}</p>
  }

  <div class="formulario-admin-panel">
    <form [formGroup]="tipoForm" (ngSubmit)="guardar()" class="formulario-admin">

      <label>
        <span>Name</span>
        <input type="text" formControlName="nombre">
        @if (tipoForm.get('nombre')?.touched && tipoForm.get('nombre')?.invalid) {
          <div style="color: var(--admin-rojo); font-size: 0.8rem;">
            @if (tipoForm.get('nombre')?.errors?.['required']) { <span>Name is required.</span> }
            @if (tipoForm.get('nombre')?.errors?.['minlength']) { <span>Minimum 3 characters.</span> }
            @if (tipoForm.get('nombre')?.errors?.['maxlength']) { <span>Maximum 100 characters.</span> }
          </div>
        }
      </label>

      <label>
        <span>Description</span>
        <textarea formControlName="descripcion" rows="4"></textarea>
        @if (tipoForm.get('descripcion')?.touched && tipoForm.get('descripcion')?.invalid) {
          <div style="color: var(--admin-rojo); font-size: 0.8rem;">
            @if (tipoForm.get('descripcion')?.errors?.['required']) { <span>Description is required.</span> }
            @if (tipoForm.get('descripcion')?.errors?.['maxlength']) { <span>Maximum 500 characters.</span> }
          </div>
        }
      </label>

      <div class="formulario-admin-imagen">
        <label>
          <span>Image URL</span>
          <input type="text" formControlName="imagenUrl" placeholder="/images/suite-1.webp">
          @if (tipoForm.get('imagenUrl')?.errors?.['maxlength']) {
            <div style="color: var(--admin-rojo); font-size: 0.8rem;">
              <span>Maximum 255 characters.</span>
            </div>
          }
        </label>

        <!-- La previa se actualiza sola con el valor del control, sin el script de Thymeleaf -->
        <div class="imagen-previa-wrap">
          <img [src]="tipoForm.get('imagenUrl')?.value || '/images/hotel.webp'" alt="Preview">
        </div>
      </div>

      <div class="formulario-admin-botones">
        <button type="submit" class="btn-dorado" [disabled]="tipoForm.invalid">Save</button>
        <a routerLink="/admin/tipos-habitacion" class="btn-contorno-oscuro">Cancel</a>
      </div>
    </form>
  </div>
</main>
