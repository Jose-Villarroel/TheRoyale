<app-cabecera (abrirMenu)="menuAbierto = true"></app-cabecera>
<app-menu-movil [abierto]="menuAbierto" (cerrar)="menuAbierto = false"></app-menu-movil>

<app-hero-interior
  [titulo]="id !== null ? 'Edit Operator' : 'New Operator'"
  subtitulo="Credentials for a member of the hotel operations staff.">
</app-hero-interior>

<main class="contenedor seccion-admin-contenido">
  <app-alerta-error [mensaje]="error"></app-alerta-error>

  <div class="formulario-admin-panel">
    <form [formGroup]="operadorForm" (ngSubmit)="guardar()" class="formulario-admin">

      <label>
        <span>Name</span>
        <input type="text" formControlName="nombre">
        <app-campo-error
          [control]="operadorForm.get('nombre')"
          [mensajes]="{ required: 'Name is required.', maxlength: 'Maximum 100 characters.' }">
        </app-campo-error>
      </label>

      <label>
        <span>Email</span>
        <input type="email" formControlName="email">
        <app-campo-error
          [control]="operadorForm.get('email')"
          [mensajes]="{ required: 'Email is required.', email: 'Enter a valid email.', maxlength: 'Maximum 150 characters.' }">
        </app-campo-error>
      </label>

      <label>
        <span>{{ id !== null ? 'New Password' : 'Password' }}</span>
        <input type="password" formControlName="password" autocomplete="new-password"
               [placeholder]="id !== null ? 'Leave blank to keep current password' : ''">
        <app-campo-error
          [control]="operadorForm.get('password')"
          [mensajes]="{ required: 'Password is required.' }">
        </app-campo-error>
      </label>

      <div class="formulario-admin-botones">
        <button type="submit" class="btn-dorado" [disabled]="operadorForm.invalid">Save</button>
        <a routerLink="/admin/operadores" class="btn-contorno-oscuro">Cancel</a>
      </div>
    </form>
  </div>
</main>

<app-pie-pagina></app-pie-pagina>
