<app-cabecera (abrirMenu)="menuAbierto = true"></app-cabecera>
<app-menu-movil [abierto]="menuAbierto" (cerrar)="menuAbierto = false"></app-menu-movil>

<app-hero-interior
  eyebrow="Reservation"
  [titulo]="confirmada
    ? (reservaIdEnEdicion ? 'Reservation Updated' : 'Reservation Confirmed')
    : (reservaIdEnEdicion ? 'Modify Your Stay' : 'Book Your Stay')"
  [subtitulo]="confirmada
    ? 'Thank you. Here are the details of your stay at The Royale.'
    : (reservaIdEnEdicion
        ? 'Pick new dates or a different room tier. Your reservation only changes if a room is available.'
        : 'Choose your dates, pick a room tier and we will assign the best available room of that tier.')">
</app-hero-interior>

<main class="contenedor seccion-admin-contenido">
  <app-alerta-error [mensaje]="error"></app-alerta-error>

  @if (!confirmada) {
    <form [formGroup]="reservaForm" (ngSubmit)="confirmar()">
      <!-- ===== 01 Fechas y huéspedes ===== -->
      <section app-paso-fechas [formulario]="reservaForm" [hoy]="hoy" [minimaSalida]="minimaSalida"></section>

      <!-- ===== 02 Tipo de habitación ===== -->
      <section app-paso-habitacion
        [rangoValido]="rangoValido"
        [consultando]="consultando"
        [noches]="noches"
        [disponibilidad]="disponibilidad"
        [tipoSeleccionadoId]="seleccionado?.tipoHabitacionId ?? null"
        (elegir)="elegirTipo($event)">
      </section>

      <!-- ===== 03 Confirmación: su botón submit dispara el (ngSubmit) de este form ===== -->
      <section app-resumen-reserva
        [fechaInicio]="reservaForm.value.fechaInicio"
        [fechaFin]="reservaForm.value.fechaFin"
        [noches]="noches"
        [cantidadPersonas]="reservaForm.value.cantidadPersonas"
        [seleccionado]="seleccionado"
        [totalEstimado]="totalEstimado"
        [esCliente]="authService.esCliente"
        [esOperador]="authService.esOperador"
        [puedeConfirmar]="puedeConfirmar"
        [enviando]="enviando"
        [enEdicion]="!!reservaIdEnEdicion"
        [urlRetorno]="urlRetorno">
      </section>
    </form>
  } @else {
    <!-- ===== Confirmación: todo lo que el cliente necesita saber, sin ir a ningún listado ===== -->
    <app-reserva-confirmada
      [reserva]="confirmada"
      [enEdicion]="!!reservaIdEnEdicion"
      (reservarOtra)="reservarOtra()">
    </app-reserva-confirmada>
  }
</main>

<app-pie-pagina></app-pie-pagina>
