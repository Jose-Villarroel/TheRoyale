<section class="formulario-admin-panel form-resena-panel" aria-labelledby="form-resena-titulo">
  <p class="eyebrow">{{ resena() ? 'Edit your review' : 'Share your stay' }}</p>
  <h2 id="form-resena-titulo" class="form-resena-titulo">{{ reserva().tipoHabitacionNombre }}</h2>
  <p class="tarjeta-reserva-meta">
    Reservation #{{ reserva().id }} · {{ reserva().fechaInicio | date:'mediumDate' }} → {{ reserva().fechaFin | date:'mediumDate' }}
  </p>

  <app-alerta-error [mensaje]="error()"></app-alerta-error>

  <form id="form-resena" [formGroup]="formulario" (ngSubmit)="enviarFormulario()" class="formulario-admin" novalidate>
    <div class="form-resena-calificacion">
      <span id="resena-calificacion-etiqueta" class="form-resena-etiqueta">Your rating</span>
      <app-estrellas modo="entrada" tamano="lg" etiqueta="Your rating"
                     [valor]="calificacion.value"
                     (valorChange)="elegirCalificacion($event)"
                     (tocado)="calificacion.markAsTouched()"></app-estrellas>
      <app-campo-error [control]="calificacion" [mensajes]="mensajesCalificacion"></app-campo-error>
    </div>

    <label>
      <span>Title (optional)</span>
      <input type="text" id="resena-titulo" formControlName="titulo" placeholder="Perfect city view">
      <app-campo-error [control]="titulo" [mensajes]="mensajesTitulo"></app-campo-error>
    </label>

    <label>
      <span>Your review</span>
      <textarea id="resena-comentario" formControlName="comentario" rows="5"
                placeholder="What did you enjoy about your stay?"
                aria-describedby="resena-comentario-contador"></textarea>
      <small id="resena-comentario-contador" class="form-resena-contador"
             [class.form-resena-contador-excedido]="largoComentario > maxComentario">{{ largoComentario }}/{{ maxComentario }}</small>
      <app-campo-error [control]="comentario" [mensajes]="mensajesComentario"></app-campo-error>
    </label>

    <div class="formulario-admin-botones">
      <button type="submit" id="btn-enviar-resena" class="btn-dorado"
              [disabled]="formulario.invalid || enviando()">{{ enviando() ? 'Sending…' : 'Submit' }}</button>
      @if (resena()) {
        <button type="button" id="btn-eliminar-resena" class="btn-eliminar"
                [disabled]="enviando()" (click)="eliminar.emit()">Delete review</button>
      }
      <button type="button" id="btn-cancelar-resena" class="enlace-subrayado" (click)="cancelar.emit()">Cancel</button>
    </div>
  </form>
</section>
