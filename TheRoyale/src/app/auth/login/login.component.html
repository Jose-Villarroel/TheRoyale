<div class="login-container">
  <div class="login-card">
    <h1 class="login-titulo">Sign In</h1>
    <p class="login-subtitulo">Welcome back to The Royale</p>
    <p *ngIf="mensaje" class="login-exito">{{ mensaje }}</p>
    <p *ngIf="error" class="login-error">{{ error }}</p>
    <form (ngSubmit)="iniciarSesion()" class="login-form">
      <label>
        <span>Email</span>
        <input type="email" [(ngModel)]="email" name="email" required autocomplete="email">
      </label>
      <label>
        <span>Password</span>
        <input type="password" [(ngModel)]="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn-dorado" [disabled]="cargando">
        {{ cargando ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
    <p class="login-alterno">Don't have an account? <a routerLink="/register">Sign Up</a></p>
    <a routerLink="/" class="login-volver">← Back to home</a>
  </div>
</div>
