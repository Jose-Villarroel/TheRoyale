<app-cabecera (abrirMenu)="menuAbierto = true"></app-cabecera>
<app-menu-movil [abierto]="menuAbierto" (cerrar)="menuAbierto = false"></app-menu-movil>

<app-hero-interior
  eyebrow="Operator Portal"
  titulo="Find Guest by Room"
  subtitulo="Enter a room number to locate the active reservation and confirm guest identity before adding services.">
</app-hero-interior>

<main class="contenedor seccion-admin-contenido panel-operador">
  <app-nav-operador></app-nav-operador>
  <app-alerta-error [mensaje]="error"></app-alerta-error>

  <!-- ===== 01 Buscador ===== -->
  <app-form-buscar-habitacion
    [(numero)]="numeroHabitacion"
    [buscando]="buscando"
    [hayResultado]="!!reserva"
    (buscar)="buscar()"
    (limpiar)="limpiar()">
  </app-form-buscar-habitacion>

  <!-- ===== 02 Resultado: identidad del huésped ===== -->
  @if (reserva) {
    <app-tarjeta-cliente-encontrado
      [reserva]="reserva"
      (gestionar)="irAReserva()"
      (limpiar)="limpiar()">
    </app-tarjeta-cliente-encontrado>
  }
</main>

<app-pie-pagina></app-pie-pagina>
