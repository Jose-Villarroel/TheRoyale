<app-cabecera (abrirMenu)="menuAbierto = true"></app-cabecera>
<app-menu-movil [abierto]="menuAbierto" (cerrar)="menuAbierto = false"></app-menu-movil>

<app-hero-interior
  eyebrow="Operator"
  titulo="Operations"
  subtitulo="Every reservation at The Royale — check guests in and out, manage their account and settle payments.">
</app-hero-interior>

<main class="contenedor seccion-admin-contenido panel-operador">
  <app-nav-operador></app-nav-operador>
  <app-alerta-error [mensaje]="error"></app-alerta-error>

  <div class="admin-encabezado">
    <p class="eyebrow">{{ reservas.length }} {{ reservas.length === 1 ? 'reservation' : 'reservations' }}</p>
  </div>

  <!-- Filtro por estado: un clic, sin recargar por un select -->
  <app-filtros-estado variante="operador" [estadoActivo]="estadoActivo" (filtrar)="filtrar($event)"></app-filtros-estado>

  <app-tabla-reservas-operador [reservas]="reservas"></app-tabla-reservas-operador>
</main>

<app-pie-pagina></app-pie-pagina>
