<form [formGroup]="formulario()" (ngSubmit)="agregar.emit()" class="operador-formulario">
  <h3 class="operador-subtitulo">Charge a service</h3>
  <label>
    <span>Service</span>
    <select id="consumo-servicio" formControlName="servicioId" class="operador-select">
      <option [ngValue]="null" disabled>Select a service…</option>
      @for (servicio of servicios(); track servicio.id) {
        <option [ngValue]="servicio.id">{{ servicio.nombre }} — {{ servicio.precio | currency:'USD' }}</option>
      }
    </select>
  </label>
  <label>
    <span>Quantity</span>
    <input type="number" id="consumo-cantidad" formControlName="cantidad" min="1" inputmode="numeric" class="operador-input">
  </label>
  <button type="submit" id="consumo-agregar" class="btn-dorado" [disabled]="formulario().invalid">Add charge</button>
</form>
