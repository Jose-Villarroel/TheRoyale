<form [formGroup]="formulario()" (ngSubmit)="registrar.emit()" class="operador-formulario">
  <h3 class="operador-subtitulo">Register payment</h3>
  <label>
    <span>Amount</span>
    <input type="number" formControlName="monto" min="0.01" step="0.01" inputmode="decimal" class="operador-input">
  </label>
  <label>
    <span>Method</span>
    <select formControlName="metodoPago" class="operador-select">
      @for (metodo of metodosPago(); track metodo) {
        <option [value]="metodo">{{ metodo }}</option>
      }
    </select>
  </label>
  <div class="operador-acciones">
    <button type="submit" class="btn-dorado" [disabled]="formulario().invalid">Register payment</button>
    <button type="button" class="btn-contorno-oscuro btn-mini" (click)="pagarSaldo.emit()"
            [disabled]="saldo() <= 0">Pay full balance</button>
  </div>
</form>
